name: "Setup pnpm and cache store"
description: "Install pnpm on Node 24 and restore the pnpm store via actions/cache using a per-job/per-run key so parallel jobs don't collide on the same cache save."
runs:
  using: "composite"
  steps:
    - name: "⚡ Setup pnpm and Node"
      uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
      with:
        version: "11.24.0"
        runtime: "node@24"
        cache: false
        install: false
    - name: "📍 Get pnpm store path"
      id: "pnpm-store"
      shell: "bash"
      run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"
    - name: "💾 Cache pnpm store"
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.pnpm-store.outputs.path }}
        key: pnpm-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ github.job }}-${{ github.run_id }}
        restore-keys: |
          pnpm-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}-
