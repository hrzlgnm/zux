name: "Setup pnpm and cache store"
description: "Install pnpm on Node 24 and restore the pnpm store via actions/cache using a per-job/per-run key so parallel jobs don't collide on the same cache save."
runs:
  using: "composite"
  steps:
    - name: "⚡ Setup pnpm and Node"
      uses: "pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2"
      with:
        version: "11.23.0"
        runtime: "node@24"
        cache: false
        install: false
    - name: "📍 Get pnpm store path"
      id: "pnpm-store"
      shell: "bash"
      run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"
    - name: "💾 Cache pnpm store"
      uses: "actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4"
      with:
        path: ${{ steps.pnpm-store.outputs.path }}
        key: pnpm-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ github.job }}-${{ github.run_id }}
        restore-keys: |
          pnpm-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}-
