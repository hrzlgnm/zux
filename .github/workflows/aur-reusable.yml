name: Arch Linux AUR

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Republish AUR packages for an existing release tag (must be the latest release). Empty runs checks only."
        required: false
        default: ""
  release:
    types: [released]

jobs:
  release-info:
    name: "🏷️ Release info"
    permissions:
      packages: read
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tagName: ${{ steps.version.outputs.tagName }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
      - name: 🏷️ Get version info
        id: version
        uses: ./.github/actions/latest-release-info

  lint-scripts:
    name: "🧹 Lint shell scripts"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
      - name: 🧹 Check shell scripts
        env:
          SCRIPTS_DIR: packaging/aur
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck shfmt
          shellcheck -S warning "$SCRIPTS_DIR"/*.sh
          shfmt --diff --indent 4 --case-indent --binary-next-line "$SCRIPTS_DIR"/*.sh

  update-aur:
    name: "📤 Update AUR"
    needs:
      - release-info
      - lint-scripts
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/hrzlgnm/zux-arch-aur-builder:v1@sha256:66270956c822dfd1445c2e469d4ae22fa0fb263c385390d7552b44e361bdeb59
    strategy:
      fail-fast: false
      matrix:
        package:
          - name: zux-bin
            checksum_url: ""
            checksum_url_deb: "https://github.com/hrzlgnm/zux/releases/download/v${{ needs.release-info.outputs.version }}/zux_${{ needs.release-info.outputs.version }}_amd64.deb"
            checksum_url_exe: "https://github.com/hrzlgnm/zux/releases/download/v${{ needs.release-info.outputs.version }}/zux_linux_x64"
            generate_script: "./packaging/aur/generate-zux-bin.sh"
            needs_exe: "true"
          - name: zux
            checksum_url: "https://github.com/hrzlgnm/zux/archive/refs/tags/v${{ needs.release-info.outputs.version }}.tar.gz"
            checksum_url_deb: ""
            checksum_url_exe: ""
            generate_script: "./packaging/aur/generate-zux.sh"
            needs_exe: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1

      - name: 🧰 Setup build environment
        run: ./packaging/aur/fix-ownership.sh

      - name: 🔢 Resolve SHA256 checksums
        id: sha256sums
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        env:
          URL: ${{ matrix.package.checksum_url }}
          URL_DEB: ${{ matrix.package.checksum_url_deb }}
          URL_EXE: ${{ matrix.package.checksum_url_exe }}
          NEEDS_EXE: ${{ matrix.package.needs_exe }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.release-info.outputs.tagName }}
        with:
          timeout_minutes: 5
          max_attempts: 5
          retry_wait_seconds: 10
          warning_on_retry: true
          command: ./packaging/aur/resolve-sha256.sh

      - name: 🔖 Sync version in Cargo.toml and tauri.conf.json
        if: matrix.package.name == 'zux'
        env:
          VERSION: ${{ needs.release-info.outputs.version }}
        run: ./packaging/aur/sync-version.sh

      - name: 🧹 Lint generated PKGBUILD
        uses: hrzlgnm/actions/.github/actions/retry@d2c23efb5ed3a9f91dd4b2b898db20aeb5aa788f # v2.9.0
        env:
          SCRIPT: ${{ matrix.package.generate_script }}
          VERSION: ${{ needs.release-info.outputs.version }}
          SHA256: ${{ steps.sha256sums.outputs.sha256 }}
          SHA256_DEB: ${{ steps.sha256sums.outputs.sha256_deb }}
          SHA256_EXE: ${{ steps.sha256sums.outputs.sha256_exe }}
          NEEDS_EXE: ${{ matrix.package.needs_exe }}
        with:
          timeout_minutes: 10
          max_attempts: 5
          retry_wait_seconds: 10
          warning_on_retry: true
          # su without --login keeps the step env and only resets
          # HOME/SHELL/USER/LOGNAME, so the script reads inputs from env.
          command: su runner -c "./packaging/aur/lint-pkgbuild.sh"

      - name: 🔒 Verify AUR deploy key secret is configured
        if: github.event.release.tag_name || inputs.tag_name
        env:
          AUR_DEPLOY_KEY: ${{ secrets.AUR_DEPLOY_KEY }}
        run: ./packaging/aur/check-deploy-key.sh

      - name: 🔑 Setup deployment keys
        if: github.event.release.tag_name || inputs.tag_name
        uses: hrzlgnm/actions/.github/actions/retry@d2c23efb5ed3a9f91dd4b2b898db20aeb5aa788f # v2.9.0
        env:
          AUR_DEPLOY_KEY: ${{ secrets.AUR_DEPLOY_KEY }}
        with:
          timeout_minutes: 5
          max_attempts: 5
          retry_wait_seconds: 10
          warning_on_retry: true
          command: ./packaging/aur/fix-ownership.sh && su runner -c "./packaging/aur/setup-aur-ssh.sh"

      - name: 📥 Clone AUR repo
        if: github.event.release.tag_name || inputs.tag_name
        uses: hrzlgnm/actions/.github/actions/retry@d2c23efb5ed3a9f91dd4b2b898db20aeb5aa788f # v2.9.0
        env:
          PKGNAME: ${{ matrix.package.name }}
        with:
          timeout_minutes: 5
          max_attempts: 5
          retry_wait_seconds: 10
          warning_on_retry: true
          command: su runner -c "./packaging/aur/clone-aur-repo.sh"

      - name: 🔍 Check version
        if: github.event.release.tag_name || inputs.tag_name
        env:
          VERSION: ${{ needs.release-info.outputs.version }}
        run: su runner -c "./packaging/aur/check-aur-version.sh"

      - name: 🚀 Generate PKGBUILD update and publish
        if: github.event.release.tag_name || inputs.tag_name
        uses: hrzlgnm/actions/.github/actions/retry@d2c23efb5ed3a9f91dd4b2b898db20aeb5aa788f # v2.9.0
        env:
          SCRIPT: ${{ matrix.package.generate_script }}
          VERSION: ${{ needs.release-info.outputs.version }}
          SHA256: ${{ steps.sha256sums.outputs.sha256 }}
          SHA256_DEB: ${{ steps.sha256sums.outputs.sha256_deb }}
          SHA256_EXE: ${{ steps.sha256sums.outputs.sha256_exe }}
          NEEDS_EXE: ${{ matrix.package.needs_exe }}
        with:
          timeout_minutes: 15
          max_attempts: 5
          retry_wait_seconds: 10
          warning_on_retry: true
          command: su runner -c "./packaging/aur/publish-aur.sh"
