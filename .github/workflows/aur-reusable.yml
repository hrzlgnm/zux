name: Arch Linux AUR

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Republish AUR packages for an existing release tag (must be the latest release). Empty runs checks only."
        required: false
        default: ""
  release:
    types: [released]

jobs:
  release-info:
    name: "🏷️ Release info"
    permissions:
      packages: read
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tagName: ${{ steps.version.outputs.tagName }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: 🏷️ Get version info
        id: version
        uses: ./.github/actions/latest-release-info

  lint-scripts:
    name: "🧹 Lint shell scripts"
    uses: hrzlgnm/actions/.github/workflows/shell-lint-reusable.yml@f85e921e2b4249d5b5b4eca7845481a382fb7a54 # v2.13.1
    with:
      runs-on: ubuntu-24.04
      scripts-dir: packaging/aur

  update-aur:
    name: "📤 Update AUR"
    needs:
      - release-info
      - lint-scripts
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/hrzlgnm/zux-arch-aur-builder:v1@sha256:66270956c822dfd1445c2e469d4ae22fa0fb263c385390d7552b44e361bdeb59
    strategy:
      fail-fast: false
      matrix:
        package:
          - name: zux-bin
            checksum_url: ""
            checksum_url_deb: "https://github.com/hrzlgnm/zux/releases/download/v${{ needs.release-info.outputs.version }}/zux_${{ needs.release-info.outputs.version }}_amd64.deb"
            checksum_url_exe: "https://github.com/hrzlgnm/zux/releases/download/v${{ needs.release-info.outputs.version }}/zux_linux_x64"
            generate_script: "./packaging/aur/generate-zux-bin.sh"
            needs_exe: "true"
          - name: zux
            checksum_url: "https://github.com/hrzlgnm/zux/archive/refs/tags/v${{ needs.release-info.outputs.version }}.tar.gz"
            checksum_url_deb: ""
            checksum_url_exe: ""
            generate_script: "./packaging/aur/generate-zux.sh"
            needs_exe: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: 🔢 Resolve SHA256 checksums
        id: sha256sums
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        env:
          URL: ${{ matrix.package.checksum_url }}
          URL_DEB: ${{ matrix.package.checksum_url_deb }}
          URL_EXE: ${{ matrix.package.checksum_url_exe }}
          NEEDS_EXE: ${{ matrix.package.needs_exe }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.release-info.outputs.tagName }}
        with:
          timeout_minutes: 5
          max_attempts: 5
          retry_wait_seconds: 10
          warning_on_retry: true
          command: ./packaging/aur/resolve-sha256.sh

      - name: 📝 Generate PKGBUILD
        uses: hrzlgnm/actions/.github/actions/retry@f85e921e2b4249d5b5b4eca7845481a382fb7a54 # v2.13.1
        env:
          GENERATE_SCRIPT: ${{ matrix.package.generate_script }}
          RELEASE_VERSION: ${{ needs.release-info.outputs.version }}
          SHA256: ${{ steps.sha256sums.outputs.sha256 }}
          SHA256_DEB: ${{ steps.sha256sums.outputs.sha256_deb }}
          SHA256_EXE: ${{ steps.sha256sums.outputs.sha256_exe }}
          NEEDS_EXE: ${{ matrix.package.needs_exe }}
        with:
          timeout_minutes: 10
          max_attempts: 5
          retry_wait_seconds: 10
          warning_on_retry: true
          # su without --login keeps the step env and only resets
          # HOME/SHELL/USER/LOGNAME, so the script reads inputs from env.
          command: su runner -c "./packaging/aur/lint-pkgbuild.sh"

      - name: 🧹 Check generated PKGBUILD
        uses: hrzlgnm/actions/.github/actions/aur-makepkg-lint@f85e921e2b4249d5b5b4eca7845481a382fb7a54 # v2.13.1
        with:
          workdir: ~/lint

      - name: 🛠️ Setup AUR packaging
        if: github.event.release.tag_name || inputs.tag_name
        uses: hrzlgnm/actions/.github/actions/aur-setup@f85e921e2b4249d5b5b4eca7845481a382fb7a54 # v2.13.1
        with:
          package-name: ${{ matrix.package.name }}
          release-version: ${{ needs.release-info.outputs.version }}
          deploy-key: ${{ secrets.AUR_DEPLOY_KEY }}

      - name: 🚀 Generate PKGBUILD update and publish
        if: github.event.release.tag_name || inputs.tag_name
        uses: hrzlgnm/actions/.github/actions/retry@f85e921e2b4249d5b5b4eca7845481a382fb7a54 # v2.13.1
        env:
          GENERATE_SCRIPT: ${{ matrix.package.generate_script }}
          RELEASE_VERSION: ${{ needs.release-info.outputs.version }}
          SHA256: ${{ steps.sha256sums.outputs.sha256 }}
          SHA256_DEB: ${{ steps.sha256sums.outputs.sha256_deb }}
          SHA256_EXE: ${{ steps.sha256sums.outputs.sha256_exe }}
          NEEDS_EXE: ${{ matrix.package.needs_exe }}
        with:
          timeout_minutes: 15
          max_attempts: 5
          retry_wait_seconds: 10
          warning_on_retry: true
          command: su runner -c "./packaging/aur/publish-aur.sh"
