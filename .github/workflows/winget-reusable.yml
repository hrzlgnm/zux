name: Publish to WinGet

on:
  workflow_call:
  workflow_dispatch:
  release:
    types: [released]

jobs:
  release-info:
    name: "🏷️ Release info"
    permissions:
      packages: read
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tagName: ${{ steps.version.outputs.tagName }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1

      - name: 🏷️ Get version info
        id: version
        uses: ./.github/actions/latest-release-info

  publish-to-winget:
    name: "🪟 Publish to WinGet"
    needs: [release-info]
    runs-on: ubuntu-24.04
    steps:
      - name: 🔒 Verify WINGET_TOKEN secret is configured
        shell: bash
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          if [ -z "$WINGET_TOKEN" ]; then
            echo "Error: WINGET_TOKEN secret is not set. Please configure a GitHub token for the hrzlgnm fork of microsoft/winget-pkgs in repository settings."
            exit 1
          fi

      - name: 🛠️ Get latest installer urls 🔗
        shell: bash
        env:
          TAG_NAME: ${{ needs.release-info.outputs.tagName }}
          VERSION: ${{ needs.release-info.outputs.version }}
        run: |
          EXE_URL="https://github.com/hrzlgnm/zux/releases/download/${TAG_NAME}/zux_${VERSION}_x64-setup.exe"
          MSI_URL="https://github.com/hrzlgnm/zux/releases/download/${TAG_NAME}/zux_${VERSION}_x64_en-US.msi"
          {
            echo "EXE_URL=$EXE_URL"
            echo "MSI_URL=$MSI_URL"
            echo "VERSION=$VERSION"
          } >> "$GITHUB_ENV"
          echo "Detected latest tag name: $TAG_NAME"
          echo "EXE_URL: $EXE_URL"
          echo "MSI_URL: $MSI_URL"
          echo "Version: $VERSION"

      - name: 🦀 Install Rust stable
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: 📦 Cache Rust builds
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          save-if: true
          cache-bin: false
          cache-targets: false
          prefix-key: "v1-rust"
          shared-key: "shared"

      - name: 🔧 Install komac
        uses: baptiste0928/cargo-install@f204293d9709061b7bc1756fec3ec4e2cd57dec0 # v3
        with:
          crate: komac
          version: 2.16.0
          locked: true

      - name: 🆙 Sync our fork of winget-pkgs
        env:
          GITHUB_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          komac sync-fork

      - name: 🆙 Update winget package
        env:
          GITHUB_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          komac update hrzlgnm.zux \
            --version "$VERSION" \
            --urls "$EXE_URL" "$MSI_URL" \
            --submit

      - name: 🧹 Cleanup merged branches
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          komac cleanup --only-merged
