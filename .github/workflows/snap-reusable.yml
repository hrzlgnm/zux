name: Update Snap

on:
  workflow_call:
  workflow_dispatch:
  release:
    types: [released]

jobs:
  trigger-snap-release:
    permissions:
      contents: read # needed to checkout repository for release info
    runs-on: ubuntu-slim
    steps:
      - name: 🔄 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: 🏷️ Get latest release info
        id: release-info
        uses: ./.github/actions/latest-release-info

      - name: 🚀 Dispatch Release snap in hrzlgnm/zux-snap
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        env:
          GH_TOKEN: ${{ secrets.SNAP_REPO_TOKEN }}
          TAG_NAME: ${{ steps.release-info.outputs.tagName }}
        with:
          timeout_minutes: 5
          max_attempts: 5
          retry_wait_seconds: 10
          warning_on_retry: true
          command: |
            echo "Dispatching Release snap for ${TAG_NAME}"
            gh workflow run release.yml \
              --repo hrzlgnm/zux-snap \
              --ref main \
              -f tagName="${TAG_NAME}"
