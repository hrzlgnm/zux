name: Update Snap

on:
  workflow_call:
  workflow_dispatch:
  release:
    types: [released]

jobs:
  trigger-snap-release:
    permissions:
      contents: read # needed to checkout repository for release info
    runs-on: ubuntu-slim
    steps:
      - name: 🔄 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: 🏷️ Get latest release info
        id: release-info
        uses: ./.github/actions/latest-release-info

      - name: 🚀 Dispatch Release snap in hrzlgnm/zux-snap
        uses: hrzlgnm/actions/.github/actions/retry@275b5f2d90d762bd71567db08b250d8ba7cdb274 # v2.14.4
        env:
          GH_TOKEN: ${{ secrets.SNAP_REPO_TOKEN }}
          TAG_NAME: ${{ steps.release-info.outputs.tagName }}
        with:
          command: |
            echo "Dispatching Release snap for ${TAG_NAME}"
            gh workflow run release.yml \
              --repo hrzlgnm/zux-snap \
              --ref main \
              -f tagName="${TAG_NAME}"
