name: Update Snap

on:
  workflow_call:
  workflow_dispatch:
  release:
    types: [released]

jobs:
  trigger-snap-release:
    permissions:
      contents: read # needed to checkout repository for release info
    runs-on: ubuntu-slim
    steps:
      - name: 🔄 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: 🏷️ Get latest release info
        id: release-info
        uses: ./.github/actions/latest-release-info

      - name: 🚀 Dispatch Release snap in hrzlgnm/zux-snap
        uses: hrzlgnm/actions/.github/actions/retry@9a8b61da03cbf93775f3fb47f6b393d06d8c62ed # v2.10.0
        env:
          GH_TOKEN: ${{ secrets.SNAP_REPO_TOKEN }}
          TAG_NAME: ${{ steps.release-info.outputs.tagName }}
        with:
          command: |
            echo "Dispatching Release snap for ${TAG_NAME}"
            gh workflow run release.yml \
              --repo hrzlgnm/zux-snap \
              --ref main \
              -f tagName="${TAG_NAME}"
