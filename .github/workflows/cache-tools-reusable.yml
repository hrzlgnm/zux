name: "Reusable cache tools for release workflow"

on:
  workflow_call:
  workflow_dispatch:

jobs:
  cache-tools:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: "ubuntu-22.04"
            symbol: 🐧
          - os: "ubuntu-24.04"
            symbol: 🐧
          - os: "macos-latest"
            symbol: 🍏
          - os: "windows-latest"
            symbol: 🪟

    name: "${{ matrix.symbol }}📦"
    runs-on: ${{ matrix.os }}
    steps:
      - name: 🔄 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1

      - name: 🦀 Install Rust stable
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      # Ensure tools used in release workflow are in the cache

      - name: 🔧 Install cargo-edit
        uses: baptiste0928/cargo-install@f204293d9709061b7bc1756fec3ec4e2cd57dec0 # v3
        with:
          crate: cargo-edit
          version: 0.13.13
          locked: true

      - name: 🔧 Install cargo-nextest
        if: matrix.os == 'ubuntu-24.04'
        uses: baptiste0928/cargo-install@f204293d9709061b7bc1756fec3ec4e2cd57dec0 # v3
        with:
          crate: cargo-nextest
          version: 0.9.143
          locked: true

      - name: 🔧 Install git-cliff
        if: matrix.os == 'ubuntu-24.04'
        uses: baptiste0928/cargo-install@f204293d9709061b7bc1756fec3ec4e2cd57dec0 # v3
        with:
          crate: git-cliff
          version: 2.13.1
          locked: true

      - name: 🔧 Warm grype DB cache
        if: matrix.os == 'ubuntu-24.04'
        uses: anchore/scan-action/download-grype@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          cache-db: true
