name: "Reusable cache tools for release workflow"

on:
  workflow_call:
  workflow_dispatch:

jobs:
  cache-tools:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: "ubuntu-22.04"
            symbol: 🐧
          - os: "ubuntu-24.04"
            symbol: 🐧
          - os: "macos-latest"
            symbol: 🍏
          - os: "windows-latest"
            symbol: 🪟

    name: "${{ matrix.symbol }}📦"
    runs-on: ${{ matrix.os }}
    steps:
      - name: 🔄 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: 🦀 Install Rust stable
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      # Ensure tools used in release workflow are in the cache

      - name: 🔧 Install cargo-nextest
        if: matrix.os == 'ubuntu-24.04'
        uses: baptiste0928/cargo-install@8195d4f734a149db85385bb4102b42efcd373759 # v3
        with:
          crate: cargo-nextest
          version: 0.9.145
          locked: true

      - name: 🔧 Install cargo-auditable
        uses: baptiste0928/cargo-install@8195d4f734a149db85385bb4102b42efcd373759 # v3
        with:
          crate: cargo-auditable
          version: 0.7.6
          locked: true
