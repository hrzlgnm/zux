name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: "🔍 Detect Changes"
    runs-on: ubuntu-24.04
    outputs:
      branch: ${{ steps.branch.outputs.branch }}
      code: ${{ steps.filter.outputs.code }}
      aur: ${{ steps.filter.outputs.aur }}
      fmt: ${{ steps.filter.outputs.fmt }}
      lint: ${{ steps.filter.outputs.lint }}
      tests: ${{ steps.filter.outputs.tests }}
      winget: ${{ steps.filter.outputs.winget }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            aur:
              - '.github/workflows/aur-reusable.yml'
              - '.github/actions/latest-release-info/action.yml'
              - 'packaging/aur/**'
            code:
              - 'src/**'
              - 'src-tauri/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - '.github/workflows/ci.yml'
            fmt:
              - 'src-tauri/**'
            lint:
              - '.github/workflows/ci.yml'
              - '_typos.toml'
            tests:
              - 'src-tauri/**'
              - 'src/**'
            winget:
              - '.github/workflows/winget-reusable.yml'
              - '.github/actions/latest-release-info/action.yml'
      - name: 🌿 Output branch name
        id: branch
        env:
          HEAD_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          echo "branch=$HEAD_REF" >> "$GITHUB_OUTPUT"

  aur:
    name: "🔨 AUR"
    needs: [changes]
    if: needs.changes.outputs.aur == 'true'
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/aur-reusable.yml

  winget:
    name: winget
    needs:
      - changes
      - actionlint
    if: needs.changes.outputs.winget == 'true'
    uses: ./.github/workflows/winget-reusable.yml
    secrets: inherit

  typos:
    name: 📝 Check typos
    if: always()
    uses: hrzlgnm/actions/.github/workflows/typos-reusable.yml@8984a8157c97612f08eb5363a6995e9497eee7fe # v2.5.5

  actionlint:
    name: 🔬 Check workflows
    if: always()
    uses: hrzlgnm/actions/.github/workflows/actionlint-reusable.yml@8984a8157c97612f08eb5363a6995e9497eee7fe # v2.5.5

  clippy:
    name: "🔍 Clippy"
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    env:
      RUSTFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: 🦀 Install Rust stable
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy
      - name: 📦 Cache Rust builds
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
      - name: 🛠️ Setup sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - name: 🔗 Enable sccache for cargo
        shell: bash
        run: |
          echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
          echo "RUSTC_WRAPPER=${SCCACHE_PATH}" >> "$GITHUB_ENV"
      - name: 🧰 Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: 🔍 Check
        run: cargo clippy -- -D warnings
        working-directory: src-tauri

  fmt:
    name: "🎨 Format"
    needs: [changes]
    if: needs.changes.outputs.fmt == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: 🦀 Install Rust stable
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt
      - name: 🎨 Check formatting
        run: cargo fmt --check
        working-directory: src-tauri

  svelte-check:
    name: "🔍 Svelte check"
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: ⚡ Setup pnpm and Node
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          version: 11.20.0
          runtime: node@24
          cache: true
          install: false
      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile
      - name: 🔍 Check
        run: pnpm run check

  tests:
    name: "🧪 Tests"
    needs: [changes]
    if: needs.changes.outputs.tests == 'true'
    runs-on: ubuntu-24.04
    permissions:
      checks: write # required for action-junit-report annotation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: 🦀 Install Rust stable
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: 📦 Cache Rust builds
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
      - name: 🛠️ Setup sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - name: 🔗 Enable sccache for cargo
        shell: bash
        run: |
          echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
          echo "RUSTC_WRAPPER=${SCCACHE_PATH}" >> "$GITHUB_ENV"
      - name: 🧰 Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: 🛠️ nextest
        uses: baptiste0928/cargo-install@f204293d9709061b7bc1756fec3ec4e2cd57dec0 # v3
        with:
          crate: cargo-nextest
          version: 0.9.143
          locked: true
      - name: ✅ Run tests with nextest
        run: cargo --locked nextest run --profile ci
        working-directory: src-tauri
        env:
          RUSTFLAGS: "-D warnings"
      - name: 📋 JUnit Report
        if: always()
        uses: mikepenz/action-junit-report@d9f48fc87bc235f7e214acf696ca5abc0a986f16 # v6
        with:
          report_paths: "**/junit.xml"
          fail_on_parse_error: true
          require_tests: true
          include_passed: true
          check_name: "JUnit Report"

  signer-check:
    name: "🔐 Signer check"
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: ⚡ Setup pnpm and Node
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          version: 11.20.0
          runtime: node@24
          cache: true
          install: false
      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile
      - name: 🔍 Check
        run: pnpm run tauri signer sign package.json

  cache-tools:
    needs: [clippy, fmt, svelte-check, signer-check]
    name: "📦 Cache tools"
    if: always() && ( github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' )
    uses: ./.github/workflows/cache-tools-reusable.yml

  alls-green:
    if: always()
    needs: [changes, actionlint, aur, typos, clippy, fmt, tests, svelte-check, signer-check, cache-tools, winget]
    runs-on: ubuntu-24.04
    steps:
      - uses: re-actors/alls-green@a638d6464689bbb24c325bb3fe9404d63a913030
        with:
          allowed-skips: >-
            aur,
            clippy,
            fmt,
            tests,
            svelte-check,
            signer-check,
            cache-tools,
            winget,
          jobs: ${{ toJSON(needs) }}
