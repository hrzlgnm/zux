name: CI
on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: "🔍 Detect Changes"
    runs-on: ubuntu-24.04
    outputs:
      branch: ${{ steps.branch.outputs.branch }}
      code: ${{ steps.filter.outputs.code }}
      aur: ${{ steps.filter.outputs.aur }}
      fmt: ${{ steps.filter.outputs.fmt }}
      lint: ${{ steps.filter.outputs.lint }}
      tests: ${{ steps.filter.outputs.tests }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: filter
        with:
          filters: |
            aur:
              - '.github/workflows/aur-reusable.yml'
              - '.github/actions/latest-release-info/action.yml'
              - 'packaging/aur/**'
            code:
              - 'src/**'
              - 'src-tauri/**'
              - 'package.json'
              - 'package-lock.json'
            fmt:
              - 'src-tauri/**'
            lint:
              - '.github/workflows/ci.yml'
              - '_typos.toml'
            tests:
              - 'src-tauri/**'
              - 'src/**'
      - name: Output branch name
        id: branch
        env:
          HEAD_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          echo "branch=$HEAD_REF" >> "$GITHUB_OUTPUT"

  aur:
    needs: [changes]
    if: needs.changes.outputs.aur == 'true'
    uses: ./.github/workflows/aur-reusable.yml

  typos:
    name: 📝 Check typos
    if: always()
    uses: hrzlgnm/actions/.github/workflows/typos-reusable.yml@8c6f0744eb0550008dfe4d671445d44a9ab72fd0 # v2.5.4

  actionlint:
    name: 🔬 Check workflows
    if: always()
    uses: hrzlgnm/actions/.github/workflows/actionlint-reusable.yml@8c6f0744eb0550008dfe4d671445d44a9ab72fd0 # v2.5.4

  clippy:
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    env:
      RUSTFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: install Rust stable
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: clippy
      - name: install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: install frontend dependencies
        run: npm ci
      - name: check
        run: cargo clippy -- -D warnings
        working-directory: src-tauri

  fmt:
    needs: [changes]
    if: needs.changes.outputs.fmt == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: install Rust stable
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: rustfmt
      - name: check formatting
        run: cargo fmt --check
        working-directory: src-tauri

  svelte-check:
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: install dependencies
        run: npm ci
      - name: check
        run: npm run check

  signer-check:
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: install dependencies
        run: npm ci
      - name: check
        run: npm run tauri signer sign package.json

  alls-green:
    if: always()
    needs: [changes, actionlint, aur, typos, clippy, fmt, svelte-check, signer-check]
    runs-on: ubuntu-24.04
    steps:
      - uses: re-actors/alls-green@a638d6464689bbb24c325bb3fe9404d63a913030
        with:
          allowed-skips: >-
            aur,
            clippy,
            fmt,
            svelte-check,
            signer-check,
          jobs: ${{ toJSON(needs) }}
