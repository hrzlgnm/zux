name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: "🔍 Detect Changes"
    runs-on: ubuntu-24.04
    outputs:
      branch: ${{ steps.branch.outputs.branch }}
      rust: ${{ steps.filter.outputs.rust }}
      aur: ${{ steps.filter.outputs.aur }}
      docker: ${{ steps.filter.outputs.docker }}
      fmt: ${{ steps.filter.outputs.fmt }}
      lint: ${{ steps.filter.outputs.lint }}
      prettier: ${{ steps.filter.outputs.prettier }}
      tests: ${{ steps.filter.outputs.tests }}
      svelte-check: ${{ steps.filter.outputs.svelte-check }}
      signer: ${{ steps.filter.outputs.signer }}
      winget: ${{ steps.filter.outputs.winget }}
      e2e: ${{ steps.filter.outputs.e2e }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            aur:
              - '.github/workflows/aur-reusable.yml'
              - '.github/actions/latest-release-info/action.yml'
              - 'packaging/aur/**'
            rust:
              - 'src-tauri/**'
              - '.github/workflows/ci.yml'
            fmt:
              - 'src-tauri/**'
            lint:
              - 'src/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'eslint.config.js'
              - 'jsconfig.json'
              - 'svelte.config.js'
              - '.github/workflows/ci.yml'
              - '.github/actions/pnpm-setup/action.yml'
            prettier:
              - 'src/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'eslint.config.js'
              - 'jsconfig.json'
              - 'svelte.config.js'
              - 'vite.config.js'
              - '.prettierrc'
              - '.prettierignore'
              - '.github/workflows/ci.yml'
              - '.github/actions/pnpm-setup/action.yml'
            tests:
              - 'src-tauri/**'
              - '.github/workflows/ci.yml'
            svelte-check:
              - 'src/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'jsconfig.json'
              - 'svelte.config.js'
              - '.github/workflows/ci.yml'
              - '.github/actions/pnpm-setup/action.yml'
            e2e:
              - 'src/**'
              - 'e2e/**'
              - 'playwright.config.js'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'vite.config.js'
              - 'svelte.config.js'
              - 'jsconfig.json'
              - '.github/workflows/ci.yml'
              - '.github/actions/pnpm-setup/action.yml'
            signer:
              - 'src-tauri/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - '.github/workflows/ci.yml'
              - '.github/actions/pnpm-setup/action.yml'
            winget:
              - '.github/workflows/winget-reusable.yml'
              - '.github/actions/latest-release-info/action.yml'
            docker:
              - '.github/docker/**'
      - name: 🌿 Output branch name
        id: branch
        env:
          HEAD_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          echo "branch=$HEAD_REF" >> "$GITHUB_OUTPUT"

  aur:
    name: "🔨 AUR"
    needs: [changes]
    if: needs.changes.outputs.aur == 'true'
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/aur-reusable.yml

  winget:
    name: winget
    needs:
      - changes
      - actionlint
    if: needs.changes.outputs.winget == 'true'
    uses: ./.github/workflows/winget-reusable.yml
    secrets: inherit

  typos:
    name: 📝 Check typos
    if: always()
    uses: hrzlgnm/actions/.github/workflows/typos-reusable.yml@ebc8a1fc2797356209b1d729b20c4ad60b9a3445 # v2.8.4

  actionlint:
    name: 🔬 Check workflows
    if: always()
    uses: hrzlgnm/actions/.github/workflows/actionlint-reusable.yml@ebc8a1fc2797356209b1d729b20c4ad60b9a3445 # v2.8.4

  clippy:
    name: "🔍 Clippy"
    needs: [changes]
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    env:
      RUSTFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: 🦀 Install Rust stable
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy
      - name: 📦 Cache Rust builds
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
          shared-key: "stable-ubuntu-24.04"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: 🛠️ Setup sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - name: 🔗 Enable sccache for cargo
        shell: bash
        run: |
          echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
          echo "RUSTC_WRAPPER=${SCCACHE_PATH}" >> "$GITHUB_ENV"
      - name: 🧰 Install dependencies
        uses: ./.github/actions/retry
        with:
          command: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: 🔍 Check
        run: cargo clippy -- -D warnings
        working-directory: src-tauri

  fmt:
    name: "🎨 Format"
    needs: [changes]
    if: needs.changes.outputs.fmt == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: 🦀 Install Rust stable
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt
      - name: 🎨 Check formatting
        run: cargo fmt --check
        working-directory: src-tauri

  prettier:
    name: "🎨 Prettier"
    needs: [changes]
    if: needs.changes.outputs.prettier == 'true'
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: ⚡ Setup pnpm and cache store
        uses: ./.github/actions/pnpm-setup
      - name: 📦 Install dependencies
        uses: ./.github/actions/retry
        with:
          command: pnpm install --frozen-lockfile
      - name: 🎨 Check formatting
        run: pnpm run format:check

  eslint:
    name: "🧹 Lint"
    needs: [changes]
    if: needs.changes.outputs.lint == 'true'
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: ⚡ Setup pnpm and cache store
        uses: ./.github/actions/pnpm-setup
      - name: 📦 Install dependencies
        uses: ./.github/actions/retry
        with:
          command: pnpm install --frozen-lockfile
      - name: 🧹 Lint
        run: pnpm run lint

  svelte-check:
    name: "🔍 Svelte check"
    needs: [changes]
    if: needs.changes.outputs.svelte-check == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: ⚡ Setup pnpm and cache store
        uses: ./.github/actions/pnpm-setup
      - name: 📦 Install dependencies
        uses: ./.github/actions/retry
        with:
          command: pnpm install --frozen-lockfile
      - name: 🔍 Check
        run: pnpm run check

  tests:
    name: "🧪 Tests"
    needs: [changes]
    if: needs.changes.outputs.tests == 'true'
    runs-on: ubuntu-24.04
    permissions:
      checks: write # required for action-junit-report annotation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: 🦀 Install Rust stable
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - name: 🛠️ Install nextest
        uses: baptiste0928/cargo-install@f204293d9709061b7bc1756fec3ec4e2cd57dec0 # v3
        with:
          crate: cargo-nextest
          version: 0.9.143
          locked: true
      - name: 📦 Cache Rust builds
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
          shared-key: "stable-ubuntu-24.04"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: 🛠️ Setup sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - name: 🔗 Enable sccache for cargo
        shell: bash
        run: |
          echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
          echo "RUSTC_WRAPPER=${SCCACHE_PATH}" >> "$GITHUB_ENV"
      - name: 🧰 Install dependencies
        uses: ./.github/actions/retry
        with:
          command: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: ✅ Run tests with nextest
        run: cargo --locked nextest run --profile ci
        working-directory: src-tauri
        env:
          RUSTFLAGS: "-D warnings"
      - name: 📋 JUnit Report
        if: always()
        uses: mikepenz/action-junit-report@a9170d5795813c01ab4901ffb045b52bab4ab09d # v6
        with:
          report_paths: "**/junit.xml"
          fail_on_parse_error: true
          require_tests: true
          include_passed: true
          check_name: "JUnit Report"

  e2e:
    name: "🎭 E2E tests"
    needs: [changes]
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: ⚡ Setup pnpm and cache store
        uses: ./.github/actions/pnpm-setup
      - name: 📦 Install dependencies
        uses: ./.github/actions/retry
        with:
          command: pnpm install --frozen-lockfile
      - name: 🎭 Install Playwright browsers
        uses: ./.github/actions/retry
        with:
          timeout_minutes: 10
          command: pnpm exec playwright install --with-deps chromium
      - name: 🧪 Run Playwright tests
        run: pnpm run test:e2e
      - name: 📋 Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  signer-check:
    name: "🔐 Signer check"
    needs: [changes]
    if: needs.changes.outputs.signer == 'true'
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: ⚡ Setup pnpm and cache store
        uses: ./.github/actions/pnpm-setup
      - name: 📦 Install dependencies
        uses: ./.github/actions/retry
        with:
          command: pnpm install --frozen-lockfile
      - name: 🔍 Check
        run: pnpm run tauri signer sign package.json

  cache-tools:
    needs: [clippy, fmt, svelte-check, signer-check, tests]
    name: "📦 Cache tools"
    if: always() && ( github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' )
    uses: ./.github/workflows/cache-tools-reusable.yml

  docker:
    name: "🐳"
    needs:
      - changes
      - actionlint
    if: needs.changes.outputs.docker == 'true' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    uses: hrzlgnm/actions/.github/workflows/docker-reusable.yml@ebc8a1fc2797356209b1d729b20c4ad60b9a3445 # v2.8.4
    with:
      branch: ${{ needs.changes.outputs.branch }}

  docker-pr:
    name: "🐳 PR"
    needs:
      - changes
      - actionlint
    if: needs.changes.outputs.docker == 'true' && github.ref != 'refs/heads/main'
    permissions:
      contents: read
      packages: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .github/docker/zux-arch-aur-builder
          file: .github/docker/zux-arch-aur-builder/Dockerfile
          push: false
          tags: ghcr.io/hrzlgnm/zux-arch-aur-builder:dev

  alls-green:
    if: always()
    needs:
      [
        changes,
        actionlint,
        aur,
        typos,
        clippy,
        fmt,
        prettier,
        eslint,
        tests,
        svelte-check,
        signer-check,
        cache-tools,
        docker,
        docker-pr,
        winget,
        e2e,
      ]
    runs-on: ubuntu-24.04
    steps:
      - uses: re-actors/alls-green@a638d6464689bbb24c325bb3fe9404d63a913030
        with:
          allowed-skips: >-
            aur,
            clippy,
            docker,
            docker-pr,
            fmt,
            prettier,
            eslint,
            tests,
            svelte-check,
            signer-check,
            cache-tools,
            winget,
            e2e,
          jobs: ${{ toJSON(needs) }}
