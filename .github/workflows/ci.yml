name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: "🔍 Detect Changes"
    runs-on: ubuntu-24.04
    outputs:
      branch: ${{ steps.branch.outputs.branch }}
      code: ${{ steps.filter.outputs.code }}
      aur: ${{ steps.filter.outputs.aur }}
      fmt: ${{ steps.filter.outputs.fmt }}
      lint: ${{ steps.filter.outputs.lint }}
      tests: ${{ steps.filter.outputs.tests }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: filter
        with:
          filters: |
            aur:
              - '.github/workflows/aur-reusable.yml'
              - '.github/actions/latest-release-info/action.yml'
              - 'packaging/aur/**'
            code:
              - 'src/**'
              - 'src-tauri/**'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/ci.yml'
            fmt:
              - 'src-tauri/**'
            lint:
              - '.github/workflows/ci.yml'
              - '_typos.toml'
            tests:
              - 'src-tauri/**'
              - 'src/**'
      - name: 🌿 Output branch name
        id: branch
        env:
          HEAD_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          echo "branch=$HEAD_REF" >> "$GITHUB_OUTPUT"

  aur:
    name: "🔨 AUR"
    needs: [changes]
    if: needs.changes.outputs.aur == 'true'
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/aur-reusable.yml

  typos:
    name: 📝 Check typos
    if: always()
    uses: hrzlgnm/actions/.github/workflows/typos-reusable.yml@8984a8157c97612f08eb5363a6995e9497eee7fe # v2.5.5

  actionlint:
    name: 🔬 Check workflows
    if: always()
    uses: hrzlgnm/actions/.github/workflows/actionlint-reusable.yml@8984a8157c97612f08eb5363a6995e9497eee7fe # v2.5.5

  clippy:
    name: "🔍 Clippy"
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    env:
      RUSTFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: 🦀 Install Rust stable
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy
      - name: 🛠️ Setup sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - name: 🔗 Enable sccache for cargo
        shell: bash
        run: |
          echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
          echo "RUSTC_WRAPPER=${SCCACHE_PATH}" >> "$GITHUB_ENV"
      - name: 🧰 Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: 🔍 Check
        run: cargo clippy -- -D warnings
        working-directory: src-tauri

  fmt:
    name: "🎨 Format"
    needs: [changes]
    if: needs.changes.outputs.fmt == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: 🦀 Install Rust stable
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt
      - name: 🎨 Check formatting
        run: cargo fmt --check
        working-directory: src-tauri

  svelte-check:
    name: "🔍 Svelte check"
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: ⚡ Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: 📦 Install dependencies
        run: npm ci
      - name: 🔍 Check
        run: npm run check

  signer-check:
    name: "🔐 Signer check"
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: ⚡ Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: 📦 Install dependencies
        run: npm ci
      - name: 🔍 Check
        run: npm run tauri signer sign package.json

  cache-tools:
    needs: [clippy, fmt, svelte-check, signer-check]
    name: "📦 Cache tools"
    if: always() && ( github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' )
    uses: ./.github/workflows/cache-tools-reusable.yml

  alls-green:
    if: always()
    needs: [changes, actionlint, aur, typos, clippy, fmt, svelte-check, signer-check, cache-tools]
    runs-on: ubuntu-24.04
    steps:
      - uses: re-actors/alls-green@a638d6464689bbb24c325bb3fe9404d63a913030
        with:
          allowed-skips: >-
            aur,
            clippy,
            fmt,
            svelte-check,
            signer-check,
            cache-tools,
          jobs: ${{ toJSON(needs) }}
