name: Release
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  draft-release:
    name: "🚀 Draft a new release"
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: 🏷️ Get version from tag
        shell: bash
        id: get_version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: 🚀 Ensure draft release exists
        shell: bash
        env:
          VERSION: ${{ steps.get_version.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          TITLE="zux ${GITHUB_REF_NAME}"
          if ! gh release view "$TAG" --json id >/dev/null 2>&1; then
            gh release create "$TAG" --draft --title "$TITLE" --notes "" \
              || echo "Release may have been created by parallel job, continuing..."
          fi

  release:
    needs: [draft-release]
    name: "🚀 Release"
    permissions:
      id-token: write # needed for OIDC token for attestation
      attestations: write # needed to create build attestations
      contents: write # needed to upload build artifacts
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: universal-apple-darwin
            args: --target universal-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.os }}
    env:
      RUSTFLAGS: "-D warnings"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: ⚡ Setup pnpm and Node
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          version: 11.20.0
          runtime: node@24
          cache: true
          install: false

      - name: 🦀 Install Rust stable
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || matrix.target }}

      - name: 🧰 Install dependencies (ubuntu)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: 📦 Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: 🔧 Install cargo-edit
        uses: baptiste0928/cargo-install@f204293d9709061b7bc1756fec3ec4e2cd57dec0 # v3
        with:
          crate: cargo-edit
          version: 0.13.13
          locked: true

      - name: 🔖 Sync version in package.json, Cargo.toml and tauri.conf.json
        shell: bash
        env:
          VERSION: ${{ needs.draft-release.outputs.version }}
        run: |
          jq --arg version "$VERSION" '.version = $version' package.json > tmp.json
          mv tmp.json package.json
          jq --arg version "$VERSION" '.version = $version' src-tauri/tauri.conf.json > tmp.json
          mv tmp.json src-tauri/tauri.conf.json
          cd src-tauri
          cargo set-version "$VERSION"

      - name: 📜 Create and 🔍 scan SBOM for vulnerabilities
        uses: ./.github/actions/sbom
        with:
          artifact-name: "sbom.${{ matrix.os }}.spdx.json"
          current-version: ${{ needs.draft-release.outputs.version }}

      - name: 🔑 Import windows signing certificate (windows only)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          New-Item -ItemType directory -Path certificate
          Set-Content -Path certificate/tempCert.txt -Value $env:WINDOWS_CERTIFICATE
          certutil -decode certificate/tempCert.txt certificate/certificate.pfx
          Remove-Item -path certificate -include tempCert.txt
          Import-PfxCertificate -FilePath certificate/certificate.pfx -CertStoreLocation Cert:\CurrentUser\My -Password (ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText)
          Remove-Item -Path certificate -Recurse -Force

      - name: 🏗️ Build and publish plain binary
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "zux ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: false
          generateReleaseNotes: false
          uploadPlainBinary: true
          args: ${{ matrix.args }} --no-bundle

      - name: 🛡️ Attest build provenance (plain binary)
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            src-tauri/target/**/release/zux
            src-tauri/target/**/release/zux.exe

      - name: 🛡️ Attest SBOM (plain binary)
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            src-tauri/target/**/release/zux
            src-tauri/target/**/release/zux.exe
          sbom-path: sbom.spdx.json

      - name: 📦 Build and publish bundles
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "zux ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: false
          generateReleaseNotes: true
          args: ${{ matrix.args }}

      - name: ✅ Verify Windows bundle signatures (windows only)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $certThumbprint = "4f3cc75f545c898d57c5cc4349873a3bff8d4527"
          $targets = @(
            Get-ChildItem -Path "src-tauri/target/release/bundle/msi" -Filter "*.msi" -File -Recurse
            Get-ChildItem -Path "src-tauri/target/release/bundle/nsis" -Filter "*.exe" -File
          )
          if ($targets.Count -eq 0) {
            throw "No Windows bundle executables found to verify"
          }
          foreach ($target in $targets) {
            $sig = Get-AuthenticodeSignature -FilePath $target.FullName
            if ($sig.Status -ne "Valid") {
              throw "$($target.FullName) signature is $($sig.Status)"
            }
            if ($sig.SignerCertificate.Thumbprint -ne $certThumbprint) {
              throw "$($target.FullName) signed by unexpected certificate $($sig.SignerCertificate.Thumbprint)"
            }
            Write-Output "OK: $($target.FullName)"
          }

      - name: ✅ Verify macOS bundle signature (macos only)
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          codesign --verify --deep --strict --verbose=2 "src-tauri/target/universal-apple-darwin/release/bundle/macos/zux.app"

      - name: 🛡️ Attest build provenance (bundles)
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            src-tauri/target/**/release/bundle/nsis/*
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/deb/*.deb
            src-tauri/target/**/release/bundle/rpm/*.rpm
            src-tauri/target/**/release/bundle/msi/*

  android-release:
    needs: [draft-release]
    name: "🤖 Android release"
    permissions:
      id-token: write # needed for OIDC token for attestation
      attestations: write # needed to create build attestations
      contents: write # needed to upload build artifacts
    runs-on: ubuntu-24.04
    env:
      RUSTFLAGS: "-D warnings"
      NDK_VERSION: 29.0.14206865

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: 🔒 Verify Android signing secrets
        shell: bash
        env:
          ANDROID_RELEASE_KEYSTORE: ${{ secrets.ANDROID_RELEASE_KEYSTORE }}
          ANDROID_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          missing=0
          for secret in ANDROID_RELEASE_KEYSTORE ANDROID_RELEASE_KEYSTORE_PASSWORD ANDROID_RELEASE_KEY_PASSWORD; do
            if [ -z "${!secret}" ]; then
              echo "Error: $secret is not configured as a repository secret"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          echo "Android signing secrets are configured"

      - name: ⚡ Setup pnpm and Node
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          version: 11.20.0
          runtime: node@24
          cache: true
          install: false

      - name: 🦀 Install Rust stable
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: ☕ Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: zulu
          java-version: "17"

      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          cmdline-tools-version: 15859902

      - name: ⚙️ Install NDK
        shell: bash
        run: android sdk install "ndk;$NDK_VERSION"

      - name: 🛠️ Set NDK_HOME
        shell: bash
        run: echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: 📦 Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: 🔧 Install cargo-edit
        uses: baptiste0928/cargo-install@f204293d9709061b7bc1756fec3ec4e2cd57dec0 # v3
        with:
          crate: cargo-edit
          version: 0.13.13
          locked: true

      - name: 🔖 Sync version in package.json, Cargo.toml and tauri.conf.json
        shell: bash
        env:
          VERSION: ${{ needs.draft-release.outputs.version }}
        run: |
          jq --arg version "$VERSION" '.version = $version' package.json > tmp.json
          mv tmp.json package.json
          jq --arg version "$VERSION" '.version = $version' src-tauri/tauri.conf.json > tmp.json
          mv tmp.json src-tauri/tauri.conf.json
          cd src-tauri
          cargo set-version "$VERSION"

      - name: 📜 Create and 🔍 scan SBOM for vulnerabilities
        uses: ./.github/actions/sbom
        with:
          artifact-name: "sbom.android.spdx.json"
          current-version: ${{ needs.draft-release.outputs.version }}

      - name: 🏗️ Build Android app bundle
        shell: bash
        run: |
          pnpm run tauri android init
          pnpm run tauri icon src-tauri/icons/icon.png
          pnpm run tauri android build

      - name: 🔑 Extract Android signing keystore
        shell: bash
        env:
          ANDROID_RELEASE_KEYSTORE: ${{ secrets.ANDROID_RELEASE_KEYSTORE }}
        run: |
          echo "$ANDROID_RELEASE_KEYSTORE" > src-tauri/gen/android/release.jks.base64
          base64 -d src-tauri/gen/android/release.jks.base64 > src-tauri/gen/android/release.jks

      - name: ✍️ Sign APK
        shell: bash
        env:
          VERSION: ${{ needs.draft-release.outputs.version }}
          ANDROID_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" sign --ks src-tauri/gen/android/release.jks \
            --ks-key-alias zux \
            --ks-pass "pass:$ANDROID_RELEASE_KEYSTORE_PASSWORD" \
            --key-pass "pass:$ANDROID_RELEASE_KEY_PASSWORD" \
            --out "src-tauri/gen/android/app/build/outputs/apk/universal/release/zux_${VERSION}.apk" \
            src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release-unsigned.apk

      - name: 🚀 Publish APK
        shell: bash
        env:
          VERSION: ${{ needs.draft-release.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          APK="src-tauri/gen/android/app/build/outputs/apk/universal/release/zux_${VERSION}.apk"
          gh release upload "$TAG" "$APK" --clobber

      - name: 🛡️ Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: src-tauri/gen/android/app/build/outputs/apk/universal/release/zux_${{ needs.draft-release.outputs.version }}.apk

      - name: 🛡️ Attest SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: src-tauri/gen/android/app/build/outputs/apk/universal/release/zux_${{ needs.draft-release.outputs.version }}.apk
          sbom-path: sbom.spdx.json

  source_checksums:
    needs: [draft-release]
    permissions:
      contents: write # to upload source checksums to release
      actions: read # to access workflow run information and secrets
    name: 🔢 Generate Source Checksums
    uses: ./.github/workflows/source-checksums-reusable.yml
    secrets: inherit
    with:
      tagName: ${{ github.ref_name }}

