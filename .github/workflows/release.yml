name: Release
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  draft-release:
    name: "🚀 Draft a new release"
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: 🏷️ Get version from tag
        shell: bash
        id: get_version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: 🚀 Ensure draft release exists
        shell: bash
        env:
          VERSION: ${{ steps.get_version.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          TITLE="zux ${GITHUB_REF_NAME}"
          if ! gh release view "$TAG" --json id >/dev/null 2>&1; then
            gh release create "$TAG" --draft --title "$TITLE" --notes "" \
              || echo "Release may have been created by parallel job, continuing..."
          fi

  release:
    needs: [draft-release]
    name: "🚀 Release"
    permissions:
      id-token: write # needed for OIDC token for attestation
      attestations: write # needed to create build attestations
      contents: write # needed to upload build artifacts
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: windows-latest
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.platform }}
    env:
      RUSTFLAGS: "-D warnings"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: ⚡ Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - name: 🦀 Install Rust stable
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: ${{ matrix.target }}

      - name: 🧰 Install dependencies (ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: 📦 Install frontend dependencies
        run: npm ci

      - name: 🔧 Install cargo-edit
        uses: baptiste0928/cargo-install@f204293d9709061b7bc1756fec3ec4e2cd57dec0 # v3
        with:
          crate: cargo-edit
          version: 0.13.13
          locked: true

      - name: 🔖 Sync version in Cargo.toml and tauri.conf.json
        shell: bash
        env:
          VERSION: ${{ needs.draft-release.outputs.version }}
        run: |
          jq --arg version "$VERSION" '.version = $version' src-tauri/tauri.conf.json > tmp.json
          mv tmp.json src-tauri/tauri.conf.json
          cd src-tauri
          cargo set-version "$VERSION"

      - name: 📜 Create and 🔍 scan SBOM for vulnerabilities
        uses: ./.github/actions/sbom
        with:
          artifact-name: "sbom.${{ matrix.platform }}.spdx.json"
          current-version: ${{ needs.draft-release.outputs.version }}

      - name: 🏗️ Build and publish plain binary
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "zux ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: false
          generateReleaseNotes: false
          uploadPlainBinary: true
          args: --no-bundle

      - name: 📦 Build and publish bundles
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "zux ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: false
          generateReleaseNotes: true

      - name: 🛡️ Attest build provenance
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4
        with:
          subject-path: |
            target/**/release/bundle/nsis/*
            target/**/release/bundle/dmg/*.dmg
            target/**/release/bundle/deb/*.deb
            target/**/release/bundle/rpm/*.rpm
            target/**/release/bundle/msi/*
            target/**/release/zux
            target/**/release/zux.exe

      - name: 🛡️ Attest SBOM
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4
        with:
          subject-path: target/**/release/zux
          sbom-path: sbom.spdx.json

  android-release:
    needs: [draft-release]
    name: "🤖 Android release"
    permissions:
      id-token: write # needed for OIDC token for attestation
      attestations: write # needed to create build attestations
      contents: write # needed to upload build artifacts
    runs-on: ubuntu-24.04
    env:
      RUSTFLAGS: "-D warnings"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: 🔒 Verify Android signing secrets
        shell: bash
        env:
          ANDROID_RELEASE_KEYSTORE: ${{ secrets.ANDROID_RELEASE_KEYSTORE }}
          ANDROID_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          missing=0
          for secret in ANDROID_RELEASE_KEYSTORE ANDROID_RELEASE_KEYSTORE_PASSWORD ANDROID_RELEASE_KEY_PASSWORD; do
            if [ -z "${!secret}" ]; then
              echo "Error: $secret is not configured as a repository secret"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          echo "Android signing secrets are configured"

      - name: ⚡ Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - name: 🦀 Install Rust stable
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: ☕ Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: zulu
          java-version: "17"

      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4

      - name: ⚙️ Install NDK
        shell: bash
        run: sdkmanager "ndk;27.0.11902837"

      - name: 🛠️ Set NDK_HOME
        shell: bash
        run: echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.11902837" >> "$GITHUB_ENV"

      - name: 📦 Install frontend dependencies
        run: npm ci

      - name: 🔧 Install cargo-edit
        uses: baptiste0928/cargo-install@f204293d9709061b7bc1756fec3ec4e2cd57dec0 # v3
        with:
          crate: cargo-edit
          version: 0.13.13
          locked: true

      - name: 🔖 Sync version in Cargo.toml and tauri.conf.json
        shell: bash
        env:
          VERSION: ${{ needs.draft-release.outputs.version }}
        run: |
          jq --arg version "$VERSION" '.version = $version' src-tauri/tauri.conf.json > tmp.json
          mv tmp.json src-tauri/tauri.conf.json
          cd src-tauri
          cargo set-version "$VERSION"

      - name: 📜 Create and 🔍 scan SBOM for vulnerabilities
        uses: ./.github/actions/sbom
        with:
          artifact-name: "sbom.android.spdx.json"
          current-version: ${{ needs.draft-release.outputs.version }}

      - name: 🏗️ Build Android app bundle
        shell: bash
        run: |
          npm run tauri android init
          npm run tauri android build

      - name: 🔑 Extract Android signing keystore
        shell: bash
        env:
          ANDROID_RELEASE_KEYSTORE: ${{ secrets.ANDROID_RELEASE_KEYSTORE }}
        run: |
          echo "$ANDROID_RELEASE_KEYSTORE" > src-tauri/gen/android/release.jks.base64
          base64 -d src-tauri/gen/android/release.jks.base64 > src-tauri/gen/android/release.jks

      - name: ✍️ Sign APK
        shell: bash
        env:
          VERSION: ${{ needs.draft-release.outputs.version }}
          ANDROID_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" sign --ks src-tauri/gen/android/release.jks \
            --ks-key-alias zux \
            --ks-pass "pass:$ANDROID_RELEASE_KEYSTORE_PASSWORD" \
            --key-pass "pass:$ANDROID_RELEASE_KEY_PASSWORD" \
            --out "src-tauri/gen/android/app/build/outputs/apk/universal/release/zux_${VERSION}.apk" \
            src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release-unsigned.apk

      - name: 🚀 Publish APK
        shell: bash
        env:
          VERSION: ${{ needs.draft-release.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          APK="src-tauri/gen/android/app/build/outputs/apk/universal/release/zux_${VERSION}.apk"
          gh release upload "$TAG" "$APK" --clobber

      - name: 🛡️ Attest build provenance
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4
        with:
          subject-path: src-tauri/gen/android/app/build/outputs/apk/universal/release/zux_${{ needs.draft-release.outputs.version }}.apk

      - name: 🛡️ Attest SBOM
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4
        with:
          subject-path: src-tauri/gen/android/app/build/outputs/apk/universal/release/zux_${{ needs.draft-release.outputs.version }}.apk
          sbom-path: sbom.spdx.json

  source_checksums:
    needs: [draft-release]
    permissions:
      contents: write # to upload source checksums to release
      actions: read # to access workflow run information and secrets
    name: 🔢 Generate Source Checksums
    uses: ./.github/workflows/source-checksums-reusable.yml
    secrets: inherit
    with:
      tagName: ${{ github.ref_name }}

  asset_checksums:
    needs:
      [
        draft-release,
        release,
        android-release,
      ]
    permissions:
      contents: write # to update release with checksums and artifacts
      actions: read # to access workflow run information and secrets
    name: 🔢 Generate Asset Checksums
    uses: ./.github/workflows/asset-checksums-reusable.yml
    secrets: inherit
    with:
      tagName: ${{ github.ref_name }}

  publish_sbom:
    needs:
      [
        draft-release,
        release,
        android-release,
        asset_checksums,
      ]
    permissions:
      contents: write # to update release with sboms
      actions: read # to download workflow artifacts
    name: 📰📜 Publish SBOM
    uses: ./.github/workflows/publish-sbom-reusable.yml
    secrets: inherit
    with:
      tagName: ${{ github.ref_name }}
