<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <style>
      :root {
        color-scheme: dark;
        --bg-primary: #1a1a2e;
        --bg-secondary: #16213e;
        --bg-tertiary: #1a1a2e;
        --border-primary: #0f3460;
        --border-accent: #4fc3f7;
        --text-primary: #e0e0e0;
        --text-secondary: #b0bec5;
        --text-muted: #78909c;
        --text-tertiary: #90a4ae;
        --text-placeholder: #546e7a;
        --accent: #4fc3f7;
        --accent-hover: #81d4fa;
        --service-type-bg: #4fc3f7;
        --service-type-border: #0288d1;
        --service-type-font: #e1f5fe;
        --instance-bg: #81c784;
        --instance-border: #388e3c;
        --instance-font: #e8f5e9;
        --host-bg: #ffb74d;
        --host-border: #f57c00;
        --host-font: #fff3e0;
        --address-bg: #ce93d8;
        --address-border: #7b1fa2;
        --address-font: #f3e5f5;
        --edge-type-instance: #90a4ae;
        --edge-instance-host: #78909c;
        --edge-host-address: #b39ddb;
        --offline-bg: #616161;
        --offline-border: #424242;
        --offline-font: #9e9e9e;
      }
      @media (prefers-color-scheme: light) {
        :root {
          color-scheme: light;
          --bg-primary: #f5f5f5;
          --bg-secondary: #ffffff;
          --bg-tertiary: #eeeeee;
          --border-primary: #e0e0e0;
          --border-accent: #1976d2;
          --text-primary: #212121;
          --text-secondary: #616161;
          --text-muted: #9e9e9e;
          --text-tertiary: #bdbdbd;
          --text-placeholder: #9e9e9e;
          --accent: #1976d2;
          --accent-hover: #42a5f5;
          --service-type-bg: #1976d2;
          --service-type-border: #0d47a1;
          --service-type-font: #0d47a1;
          --instance-bg: #388e3c;
          --instance-border: #1b5e20;
          --instance-font: #1b5e20;
          --host-bg: #f57c00;
          --host-border: #e65100;
          --host-font: #e65100;
          --address-bg: #7b1fa2;
          --address-border: #4a148c;
          --address-font: #4a148c;
          --edge-type-instance: #9e9e9e;
          --edge-instance-host: #bdbdbd;
          --edge-host-address: #7b1fa2;
          --offline-bg: #bdbdbd;
          --offline-border: #9e9e9e;
          --offline-font: #757575;
        }
      }
    </style>
    <script>
      try {
        const m = window.matchMedia('(prefers-color-scheme: light)')
        document.documentElement.style.colorScheme = m.matches ? 'light' : 'dark'
      } catch {}
    </script>
    <title>zux — mDNS-SD Network Visualizer</title>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
